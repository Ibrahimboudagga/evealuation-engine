name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are disposable. Main/tag delivery runs may already be
  # attesting or promoting a digest and must finish atomically.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GRADIO_ANALYTICS_ENABLED: 'False'
  HF_HUB_OFFLINE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  tests:
    name: Tests / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.14']

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check installed dependency compatibility
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q app scripts run_eval.py run_scenarios.py

      - name: Run test suite
        run: python -m pytest -q --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-python-${{ matrix.python }}
          path: test-results.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Record resolved dependencies
        if: matrix.python == '3.11'
        run: python -m pip freeze > resolved-dependencies.txt

      - name: Upload dependency inventory
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: resolved-dependencies-python-3.11
          path: resolved-dependencies.txt
          retention-days: 30

  postgres-rehearsal:
    name: PostgreSQL migration and restore rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: evaluation_test
          POSTGRES_USER: evaluation
          POSTGRES_PASSWORD: 'ci%encoded/pass'
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U evaluation -d evaluation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application and PostgreSQL client
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: Create disposable restore database
        run: createdb evaluation_restore
        env:
          PGHOST: localhost
          PGUSER: evaluation
          PGPASSWORD: 'ci%encoded/pass'

      - name: Apply migrations, execute, back up, and verify restore
        run: python -m scripts.deployment_smoke
        env:
          DATABASE_URL: 'postgresql+psycopg://evaluation:ci%25encoded%2Fpass@localhost:5432/evaluation_test'
          RESTORE_DATABASE_URL: 'postgresql+psycopg://evaluation:ci%25encoded%2Fpass@localhost:5432/evaluation_restore'
          SMOKE_EVIDENCE_PATH: deployment-smoke-evidence.json

      - name: Upload restore evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: postgres-restore-evidence
          path: deployment-smoke-evidence.json
          if-no-files-found: warn
          retention-days: 30

  container-smoke:
    name: Production Compose smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [tests, postgres-rehearsal]
    env:
      POSTGRES_PASSWORD: ciContainerPassword2026
      WORKSPACE_ENCRYPTION_KEY: nE2GzCPhZYs7pF5uHnozL_Digkc8jvOnSeys1bpFHj8=
      BOOTSTRAP_SECRET: ci-bootstrap-secret
      AUTH_THROTTLE_SECRET: ci-auth-throttle-secret-at-least-32-characters

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build and start production stack
        run: |
          docker compose config --quiet
          docker compose up --build --detach

      - name: Verify non-root image, API, and UI
        shell: bash
        run: |
          set -euo pipefail
          api_image="$(docker compose images --quiet api)"
          test -n "$api_image"
          test "$(docker image inspect --format '{{.Config.User}}' "$api_image")" = "appuser"
          wait_for_url() {
            local url="$1"
            for attempt in $(seq 1 90); do
              if curl --fail --silent --show-error --output /dev/null "$url"; then
                return 0
              fi
              sleep 2
            done
            echo "Timed out waiting for $url" >&2
            return 1
          }
          wait_for_url http://127.0.0.1:8000/health/ready
          wait_for_url http://127.0.0.1:7860/
          curl --fail --silent --show-error http://127.0.0.1:8000/health/live

      - name: Collect container logs
        if: always()
        shell: bash
        run: |
          docker compose ps --all > container-smoke.log 2>&1 || true
          docker compose logs --no-color >> container-smoke.log 2>&1 || true

      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-compose-smoke-logs
          path: container-smoke.log
          if-no-files-found: error
          retention-days: 14

      - name: Stop production stack
        if: always()
        run: docker compose down --volumes --remove-orphans || true

  ci-gate:
    name: CI gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs: [tests, postgres-rehearsal, container-smoke]
    steps:
      - name: Require every validation stage
        shell: bash
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          POSTGRES_RESULT: ${{ needs.postgres-rehearsal.result }}
          CONTAINER_RESULT: ${{ needs.container-smoke.result }}
        run: |
          set -euo pipefail
          test "$TESTS_RESULT" = success
          test "$POSTGRES_RESULT" = success
          test "$CONTAINER_RESULT" = success

  publish:
    name: Publish immutable container
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: ci-gate
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=auto
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{raw}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build candidate image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.name }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
          provenance: mode=max
          sbom: true

      - name: Smoke-test exact candidate digest
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          WORKSPACE_ENCRYPTION_KEY: nE2GzCPhZYs7pF5uHnozL_Digkc8jvOnSeys1bpFHj8=
        run: |
          set -euo pipefail
          reference="${IMAGE}@${DIGEST}"
          docker pull "$reference"
          test "$(docker image inspect --format '{{.Config.User}}' "$reference")" = "appuser"
          docker run --detach --name release-image-smoke \
            --publish 127.0.0.1:8001:8000 \
            --env APP_ENVIRONMENT=development \
            --env DATABASE_URL=sqlite:////tmp/release-smoke.db \
            --env WORKSPACE_ENCRYPTION_KEY="$WORKSPACE_ENCRYPTION_KEY" \
            "$reference"
          cleanup() {
            docker logs release-image-smoke || true
            docker rm --force release-image-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8001/health/ready; then
              exit 0
            fi
            sleep 2
          done
          echo "Candidate image did not become ready." >&2
          exit 1

      - name: Attest published image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Promote tested digest to release tags
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              docker buildx imagetools create --tag "$tag" "${IMAGE}@${DIGEST}"
            fi
          done <<< "$TAGS"

      - name: Write delivery summary
        shell: bash
        run: |
          {
            echo "## Published container"
            echo
            echo "- Image: \`${{ steps.image.outputs.name }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Source: \`${GITHUB_SHA}\`"
            echo
            echo "Deploy the digest above, rather than a mutable tag, when promoting a release."
          } >> "$GITHUB_STEP_SUMMARY"
