name: Tests and deployment smoke
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.14']
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: evaluation_test
          POSTGRES_USER: evaluation
          POSTGRES_PASSWORD: 'ci%encoded/pass'
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U evaluation -d evaluation_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GRADIO_ANALYTICS_ENABLED: 'False'
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Install PostgreSQL backup client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Create disposable restore database
        run: createdb evaluation_restore
        env:
          PGHOST: localhost
          PGUSER: evaluation
          PGPASSWORD: 'ci%encoded/pass'
      - name: PostgreSQL startup, backup and verified restore
        run: python -m scripts.deployment_smoke
        env:
          DATABASE_URL: 'postgresql+psycopg://evaluation:ci%25encoded%2Fpass@localhost:5432/evaluation_test'
          RESTORE_DATABASE_URL: 'postgresql+psycopg://evaluation:ci%25encoded%2Fpass@localhost:5432/evaluation_restore'
          SMOKE_EVIDENCE_PATH: deployment-smoke-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: restore-evidence-python-${{ matrix.python }}
          path: deployment-smoke-evidence.json
      - name: Record resolved runtime dependencies
        run: python -m pip freeze > resolved-dependencies.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dependencies-python-${{ matrix.python }}
          path: resolved-dependencies.txt
